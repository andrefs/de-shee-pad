<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>My Chrome Extension</title>
  <link rel="stylesheet" href="popup.css" />
</head>

<body>
  <div class="app">
    <div class="top">
      <img id="logo" src="./icons/logo_gray.png"></img>
      <p id="de-shee-pad-title" class="title">Decipad</p>
      <p id="de-shee-pad-subtitle" class="subtitle">
        Import tables to add context and explain your thinking.
      </p>
    </div>
    <div class="side">
      <p class="deci-button">
        <a target="_blank" id="de-shee-pad-link">Import to Decipad</a>
      </p>
      <p id="de-shee-pad-email"></p>
    </div>
  </div>

  <script src="popup.js"></script>

  <!--
      This HTML file opens when you click on icon from the toolbar.

      To begin the development, run `npm run watch`.
      To create a production bundle, use `npm run build`.
    -->
</body>

</html>
